[package]
name = "blitzlink-relay"
description = "BlitzLink — official signaling relay (join codes MCJE-XXXX, public server list, optional STUN)."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "blitzlink-relay"
path = "src/main.rs"

[dependencies]
blitzlink-core = { path = "../blitzlink-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json", "query"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
clap = { version = "=4.6.7", features = ["derive"] }
# 공개 목록 검열(`chat_filter`).
aho-corasick = "=1.1.5"
unicode-normalization = "=0.1.26"
unicode-segmentation = "=1.13.3"

[dev-dependencies]
# 끝에서 끝까지: 중계 + str0m 피어 둘(호스트 자리·클라 자리).
str0m = { version = "=0.25.0", default-features = false, features = ["rust-crypto"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake"] }
