import java.security.MessageDigest

plugins {
    // https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.148' apply false
    // https://fabricmc.net/develop — 26.x is unobfuscated, so the non-remapping Loom plugin.
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// ---- blitzlink-tunnel sidecar → build/natives/<platform>/ + index.txt (`<platform> <file> <sha256>`) ----
// Source, first match wins per platform:
//   1. natives/<platform>/blitzlink-tunnel(.exe) — the `natives` artifact of .github/workflows/natives.yml downloaded
//      into the repo root (CI does this; every platform is built on its own native runner).
//   2. native/target/<triple>/release/… (or native/target/release/… for the host) — a local `cargo build --release`.
// A missing platform is skipped: the mod then reports "no tunnel for this platform" there, so Java-only builds still work.
def nativeTargets = [
        'windows-x64'  : ['x86_64-pc-windows-msvc', 'blitzlink-tunnel.exe'],
        'windows-arm64': ['aarch64-pc-windows-msvc', 'blitzlink-tunnel.exe'],
        'linux-x64'    : ['x86_64-unknown-linux-gnu', 'blitzlink-tunnel'],
        'linux-arm64'  : ['aarch64-unknown-linux-gnu', 'blitzlink-tunnel'],
]

tasks.register('bundleNatives') {
    def out = layout.buildDirectory.dir('natives')
    def ciDir = file('natives')
    def targetDir = file('native/target')
    inputs.files(fileTree(ciDir) { include '*/blitzlink-tunnel*' }).optional()
    inputs.files(fileTree(targetDir) { include '*/release/blitzlink-tunnel', '*/release/blitzlink-tunnel.exe', 'release/blitzlink-tunnel*' }).optional()
    outputs.dir(out)
    doLast {
        def dir = out.get().asFile
        project.delete(dir)
        dir.mkdirs()
        def hostPlatform = System.getProperty('os.name').toLowerCase().contains('win')
                ? (System.getProperty('os.arch') == 'aarch64' ? 'windows-arm64' : 'windows-x64')
                : (System.getProperty('os.arch') == 'aarch64' ? 'linux-arm64' : 'linux-x64')
        def index = new StringBuilder()
        nativeTargets.each { platform, spec ->
            def (triple, name) = spec
            def candidates = [new File(ciDir, "${platform}/${name}"), new File(targetDir, "${triple}/release/${name}")]
            if (platform == hostPlatform) candidates << new File(targetDir, "release/${name}")
            def src = candidates.find { it.exists() }
            if (src == null) return
            def dest = new File(dir, "${platform}/${name}")
            dest.parentFile.mkdirs()
            dest.bytes = src.bytes
            def sha = MessageDigest.getInstance('SHA-256').digest(dest.bytes).encodeHex().toString()
            index.append("${platform} ${name} ${sha}\n")
        }
        new File(dir, 'index.txt').text = index.toString()
        logger.lifecycle("bundleNatives: ${index.toString().readLines().collect { it.split(' ')[0] } ?: 'none'}")
    }
}

// ---- ONE mod file for NeoForge and Fabric ----
// Common code compiled against vanilla (the `common` project), plus each loader's own package
// (com/hyproj/blitzlink/{neoforge,fabric}), both loader manifests, fonts/lang, net.json and every sidecar binary.
// Platform.get() picks the loader at runtime, so neither loader ever links the other one's classes.
tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Builds the single BlitzLink mod jar for NeoForge and Fabric.'
    archiveFileName = "blitzlink-${mod_version}+mc${minecraft_version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.FAIL

    dependsOn ':common:classes', ':neoforge:classes', ':neoforge:generateModMetadata', ':fabric:classes', ':fabric:processResources', 'bundleNatives'

    from(project(':common').layout.buildDirectory.dir('classes/java/main'))
    from(project(':common').layout.buildDirectory.dir('resources/main'))
    from(project(':neoforge').layout.buildDirectory.dir('classes/java/main')) { include 'com/hyproj/blitzlink/neoforge/**' }
    from(project(':neoforge').layout.buildDirectory.dir('generated/sources/modMetadata')) { include 'META-INF/neoforge.mods.toml' }
    from(project(':fabric').layout.buildDirectory.dir('resources/main')) { include 'fabric.mod.json' }
    from(project(':fabric').layout.buildDirectory.dir('classes/java/main')) { include 'com/hyproj/blitzlink/fabric/**' }
    from(file('data')) { include 'net.json'; into 'blitzlink' }
    from(layout.buildDirectory.dir('natives')) { into 'natives' }
    from(file('docs/license')) { into 'META-INF/licenses' }
    from(file('LICENSE')) { into 'META-INF' }
    from(file('NOTICE')) { into 'META-INF' }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

// `gradlew build` also produces the universal jar and the Bukkit plugin.
tasks.register('build') {
    group = 'build'
    dependsOn 'universalJar', ':bukkit:build', ':common:test'
}
